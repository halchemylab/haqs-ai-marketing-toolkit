[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haqs-ai-marketing-toolkit"
version = "0.1.0"
description = "Terminal scripts for generating marketing content, campaign URLs, QR codes, and project plans."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "qrcode[pil]>=7.4.2",
]

[tool.setuptools]
py-modules = [
    "campaign_url_builder",
    "content_repurposer",
    "email_generator",
    "landing_page_copy_generator",
    "main",
    "project_plan_builder",
    "qr_code_generator",
    "roi_report",
    "testimonial_formatter",
]
packages = [
    "haqs_toolkit",
    "haqs_toolkit.generators",
    "haqs_toolkit.utils",
    "utils",
]

[project.scripts]
haqs-toolkit = "haqs_toolkit.cli:main"
haqs-event = "haqs_toolkit.events:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
